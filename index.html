<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('resim/background1.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      transition: all 0.3s;
    }
    
    .mic-indicator.listening {
      background: #44bd32;
      animation: pulse 1s infinite;
    }
    .mic-indicator.thinking {
      background: #fbc531;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    .char-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: #ffffff;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
    }

    .char-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .char-btn.active {
      border-color: #fbc531;
      transform: scale(1.15);
      box-shadow: 0 0 15px rgba(251, 197, 49, 0.9);
    }
  </style>
</head>
<body>

  <div class="mic-indicator" id="micBtn">🎤</div>

  <div class="bottom-bar">
    <button class="char-btn active" onclick="switchCharacter('Şirin Baba')">
      <img src="resim/sirinbababuton.png" alt="Şirin Baba">
    </button>
    <button class="char-btn" onclick="switchCharacter('Şirine')">
      <img src="resim/sirinebuton.png" alt="Şirine">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gargamel')">
      <img src="resim/gargamelbuton.png" alt="Gargamel">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gözlüklü Şirin')">
      <img src="resim/gozluklubuton.png" alt="Gözlüklü Şirin">
    </button>
  </div>

  <script>
    // 1. TAMAMEN ÜCRETSİZ GOOGLE GEMINI API ANAHTARINIZ
    const GEMINI_API_KEY = "BURAYA_FREE_GEMINI_API_KEY_GELECEK";

    let activeChar = "Şirin Baba";
    let isSpeaking = false;
    let isThinking = false;

    const micBtn = document.getElementById('micBtn');

    // Karakterlerin Davranış Kalıpları (Prompting)
    const charPrompts = {
      "Şirin Baba": "Sen Şirinler köyünün bilge lideri Şirin Baba'sın. Karşındaki küçük bir çocuk. Ona babacan, sevecen, eğitici ve tatlı bir dille cevap ver. Yanıtların en fazla 2-3 cümle olsun.",
      "Şirine": "Sen Şirinler köyündeki Şirine'sin. Çok neşeli, tatlı, nazik ve enerjiksin. Yanıtların çocuksu, eğlenceli ve 2-3 cümleyi geçmesin.",
      "Gargamel": "Sen Şirinler'in düşmanı Gargamel'sin ama komik ve zararsız bir şekilde huysuzsun. Şirinleri yakalamaktan bahset ama çocukla eğlenceli ve şakacı bir dille konuş. Cevabın kısa olsun.",
      "Gözlüklü Şirin": "Sen Her şeyi çok bildiğini sanan Gözlüklü Şirin'sin. 'Şirin Baba her zaman der ki...' gibi cümleler kullan, biraz bilgiç ama çok tatlı konuş. Cevabın kısa olsun."
    };

    function switchCharacter(name) {
      activeChar = name;
      const buttons = document.querySelectorAll('.char-btn');
      buttons.forEach(el => el.classList.remove('active'));

      if(name === 'Şirin Baba') buttons[0].classList.add('active');
      if(name === 'Şirine') buttons[1].classList.add('active');
      if(name === 'Gargamel') buttons[2].classList.add('active');
      if(name === 'Gözlüklü Şirin') buttons[3].classList.add('active');

      speakText(`Merhaba! Ben ${activeChar}, seninle sohbet etmek için sabırsızlanıyorum!`);
    }

    // 2. BULUTTAKİ ÜCRETSİZ GEMINI YAPAY ZEKASINDAN ANLIK CEVAP ALMA
    async function getAIResponse(userText) {
      micBtn.className = "mic-indicator thinking";
      isThinking = true;

      const systemPrompt = charPrompts[activeChar];
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nÇocuğun söylediği: "${userText}"` }]
            }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        return reply;
      } catch (err) {
        return "Üzgünüm, şu an seni tam duyamadım küçük dostum!";
      } finally {
        isThinking = false;
      }
    }

    // 3. ANLIK ÜRETİLEN CEVABI SESLENDİRME (Ücretsiz Tarayıcı Sesi)
    function speakText(text) {
      window.speechSynthesis.cancel(); // Önceki sesleri durdur

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';

      // Karakterlere göre ses frekans ayarları
      if (activeChar === "Şirin Baba") {
        utterance.pitch = 0.8; // Biraz daha kalın/babacan
        utterance.rate = 0.9;  // Yavaş ve sakin
      } else if (activeChar === "Şirine") {
        utterance.pitch = 1.4; // Tiz, tatlı ve ince
        utterance.rate = 1.0;
      } else if (activeChar === "Gargamel") {
        utterance.pitch = 0.6; // Kalın ve huysuz
        utterance.rate = 1.1;
      } else if (activeChar === "Gözlüklü Şirin") {
        utterance.pitch = 1.2; // Biraz hızlı ve bilgiç
        utterance.rate = 1.1;
      }

      isSpeaking = true;
      stopListening();

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    // SES TANIMA (MİKROFON)
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking && !isThinking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        if(!text) return;

        // Anlık cevap üret ve seslendir
        const aiResponse = await getAIResponse(text);
        speakText(aiResponse);
      };

      window.onload = () => { startListening(); };
    }

    function stopListening() { 
      micBtn.className = "mic-indicator";
      if(recognition) try{ recognition.stop(); }catch(e){} 
    }
    
    function startListening() { 
      if(recognition && !isSpeaking && !isThinking) {
        micBtn.className = "mic-indicator listening";
        try{ recognition.start(); }catch(e){} 
      }
    }
  </script>
</body>
</html>
