<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('resim/background1.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Üst Mikrofon Durum İkonu */
    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 200;
      transition: all 0.3s;
    }
    .mic-indicator.listening { background: #44bd32; animation: pulse 1s infinite; }
    .mic-indicator.thinking { background: #fbc531; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Karakterlerin Alanı (Ekranın Ortası ve Altı) */
    .character-stage {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      width: 90%;
      max-width: 1000px;
      height: 400px;
      z-index: 100;
    }

    /* Karakter Kartları / Butonları */
    .char-card {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: #ffffff;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0.5; /* Konuşmayanlar arka planda şeffaf */
      transform: scale(0.8);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .char-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Öne Çıkan / Konuşan Karakter (Yaklaşma Efekti) */
    .char-card.active {
      opacity: 1;
      transform: scale(1.8) translateY(-40px); /* Büyür ve öne yaklaşır */
      border-color: #fbc531;
      box-shadow: 0 10px 30px rgba(251, 197, 49, 0.8);
      z-index: 150;
    }
  </style>
</head>
<body>

  <div class="mic-indicator" id="micBtn">🎤</div>

  <!-- Karakter Sahnesi -->
  <div class="character-stage">
    <div class="char-card active" id="card-sirinbaba" onclick="switchCharacter('Şirin Baba')">
      <img src="resim/sirinbababuton.png" alt="Şirin Baba">
    </div>
    <div class="char-card" id="card-sirine" onclick="switchCharacter('Şirine')">
      <img src="resim/sirinebuton.png" alt="Şirine">
    </div>
    <div class="char-card" id="card-gargamel" onclick="switchCharacter('Gargamel')">
      <img src="resim/gargamelbuton.png" alt="Gargamel">
    </div>
    <div class="char-card" id="card-gozluklu" onclick="switchCharacter('Gözlüklü Şirin')">
      <img src="resim/gozluklubuton.png" alt="Gözlüklü Şirin">
    </div>
  </div>

  <script>
    // 1. GOOGLE GEMINI FREE API ANAHTARI
    const GEMINI_API_KEY = "BURAYA_FREE_GEMINI_API_KEY_GELECEK";

    let activeChar = "Şirin Baba";
    let isSpeaking = false;
    let isThinking = false;

    const micBtn = document.getElementById('micBtn');

    // Türkçe Karakter Prompt'ları
    const charPrompts = {
      "Şirin Baba": "Sen Şirinler köyünün bilge lideri Şirin Baba'sın. SADECE TÜRKÇE KONUŞ. Karşındaki küçük bir çocuk. Ona babacan, sevecen, eğitici ve tatlı bir dille Türkçe cevap ver. Yanıtların 2-3 cümleyi geçmesin.",
      "Şirine": "Sen Şirinler köyündeki Şirine'sin. SADECE TÜRKÇE KONUŞ. Çok neşeli, tatlı, nazik ve enerjiksin. Yanıtların çocuksu ve neşeli Türkçe olsun. En fazla 2-3 cümle yaz.",
      "Gargamel": "Sen Şirinler'in düşmanı komik Gargamel'sin. SADECE TÜRKÇE KONUŞ. Huysuz ama eğlenceli konuş. Şirinleri yakalama planlarından bahset ama çocuğu güldürecek tatlılıkta Türkçe olsun. Kısa cevap ver.",
      "Gözlüklü Şirin": "Sen Her şeyi bildiğini sanan Gözlüklü Şirin'sin. SADECE TÜRKÇE KONUŞ. 'Şirin Baba her zaman der ki...' gibi Türkçe ifadeler kullan. Bilgiç ama tatlı konuş. Kısa cevap ver."
    };

    // Karakter Değiştirme ve Görseli Öne Çıkarma
    function switchCharacter(name) {
      activeChar = name;
      
      const cards = document.querySelectorAll('.char-card');
      cards.forEach(el => el.classList.remove('active'));

      if(name === 'Şirin Baba') document.getElementById('card-sirinbaba').classList.add('active');
      if(name === 'Şirine') document.getElementById('card-sirine').classList.add('active');
      if(name === 'Gargamel') document.getElementById('card-gargamel').classList.add('active');
      if(name === 'Gözlüklü Şirin') document.getElementById('card-gozluklu').classList.add('active');

      speakText(`Merhaba küçük dostum! Ben ${activeChar}, seninle Türkçe konuşmak harika!`);
    }

    // Sesli Komutla Karakter Çağırma Kontrolü
    function checkVoiceCharacterSwitch(userText) {
      const text = userText.toLowerCase();

      if ((text.includes("şirin baba") || text.includes("baba")) && activeChar !== "Şirin Baba") {
        switchCharacter("Şirin Baba");
        return true;
      }
      if (text.includes("şirine") && activeChar !== "Şirine") {
        switchCharacter("Şirine");
        return true;
      }
      if (text.includes("gargamel") && activeChar !== "Gargamel") {
        switchCharacter("Gargamel");
        return true;
      }
      if ((text.includes("gözlüklü") || text.includes("gözlük")) && activeChar !== "Gözlüklü Şirin") {
        switchCharacter("Gözlüklü Şirin");
        return true;
      }
      return false;
    }

    // Google Gemini Ücretsiz Türkçe Cevap Üretici
    async function getAIResponse(userText) {
      micBtn.className = "mic-indicator thinking";
      isThinking = true;

      const systemPrompt = charPrompts[activeChar];
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nÇocuğun söylediği: "${userText}"` }]
            }]
          })
        });

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "Seni tam anlayamadım küçük dostum, tekrar söyler misin?";
      } finally {
        isThinking = false;
      }
    }

    // Türkçe Canlı Seslendirme Motoru
    function speakText(text) {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR'; // Türkçe Ses

      // Karakter Tonlamaları
      if (activeChar === "Şirin Baba") { utterance.pitch = 0.8; utterance.rate = 0.9; }
      else if (activeChar === "Şirine") { utterance.pitch = 1.4; utterance.rate = 1.0; }
      else if (activeChar === "Gargamel") { utterance.pitch = 0.6; utterance.rate = 1.1; }
      else if (activeChar === "Gözlüklü Şirin") { utterance.pitch = 1.2; utterance.rate = 1.1; }

      isSpeaking = true;
      stopListening();

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    // Ses Tanıma (Mikrofon)
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR'; // Türkçe Dinleme
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking && !isThinking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        if(!text) return;

        // 1. Önce sesli olarak bir karakter mi çağrıldı kontrol et
        const characterChanged = checkVoiceCharacterSwitch(text);

        // 2. Karakter değişmediyse mevcut karakter Türkçe cevap üretsin
        if (!characterChanged) {
          const aiResponse = await getAIResponse(text);
          speakText(aiResponse);
        }
      };

      window.onload = () => { startListening(); };
    }

    function stopListening() { 
      micBtn.className = "mic-indicator";
      if(recognition) try{ recognition.stop(); }catch(e){} 
    }
    
    function startListening() { 
      if(recognition && !isSpeaking && !isThinking) {
        micBtn.className = "mic-indicator listening";
        try{ recognition.start(); }catch(e){} 
      }
    }
  </script>
</body>
</html>
