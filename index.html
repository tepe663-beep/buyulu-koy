<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            width: 100%;
            height: 100%;
            background: url('image/background.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* Mikrofon Butonu */
        .mic-icon {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.25);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 3px solid rgba(255,255,255,0.5);
        }

        .mic-icon:hover {
            transform: translateX(-50%) scale(1.15);
            background: rgba(255, 255, 255, 0.35);
        }

        .mic-icon.listening {
            animation: pulse 1s infinite;
            background: rgba(255, 80, 80, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        /* Büyük Karakter Gösterim Alanı */
        .character-display-container {
            position: absolute;
            bottom: 170px; /* Butonların hemen üstü */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none; /* Tıklamaları engellememesi için */
        }

        .character-img {
            max-height: 55vh; /* Ekranın %55'i kadar yükseklik */
            max-width: 90vw;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none; /* Varsayılan olarak gizli */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .character-img.active {
            display: inline-block;
            opacity: 1;
            transform: scale(1);
            /* Konuşma ve Dans Animasyonu */
            animation: danceTalk 2.5s infinite ease-in-out;
        }

        /* CSS ile Konuşma ve Dans Simülasyonu */
        @keyframes danceTalk {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            20% {
                transform: translateY(-15px) scale(1.03) rotate(-3deg); /* Sola eğilip zıplama */
            }
            40% {
                transform: translateY(0) scale(0.97) rotate(0deg); /* Konuşma efekti (küçülme) */
            }
            60% {
                transform: translateY(-10px) scale(1.02) rotate(3deg); /* Sağa eğilip zıplama */
            }
            80% {
                transform: translateY(0) scale(0.98) rotate(0deg); /* Konuşma efekti */
            }
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        /* Alt Küçük Butonlar */
        .buttons-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .character-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: transparent;
            padding: 0;
        }

        .character-btn:hover {
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .character-btn.active {
            animation: popOut 0.6s ease;
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
            z-index: 100;
        }

        @keyframes popOut {
            0% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.4) translateY(-20px); }
            100% { transform: scale(1.2) translateY(-10px); }
        }

        .character-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        /* Durum Metni */
        .status-text {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0,0,0,0.35);
            padding: 12px 24px;
            border-radius: 25px;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .status-text.show {
            opacity: 1;
        }

        /* Mobil uyumluluk */
        @media (max-width: 650px) {
            .buttons-container { gap: 15px; bottom: 20px; }
            .character-btn { width: 75px; height: 75px; }
            .character-display-container { bottom: 130px; }
            .character-img { max-height: 45vh; }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="mic-icon" id="micBtn">🎤</div>
        <div class="status-text" id="statusText"></div>

        <!-- Büyük Karakter Görselleri -->
        <div class="character-display-container">
            <img src="image/sirinbababuyuk.png" alt="Şirin Baba" class="character-img" id="img-sirinbaba">
            <img src="image/sirinebuyuk.png" alt="Şirine" class="character-img" id="img-sirine">
            <img src="image/gozluklubuyuk.png" alt="Gözlüklü" class="character-img" id="img-gozluklu">
            <img src="image/gargamelbuyuk.png" alt="Gargamel" class="character-img" id="img-gargamel">
        </div>

        <!-- Alt Küçük Butonlar -->
        <div class="buttons-container">
            <div class="character-btn" data-character="sirinbaba">
                <img src="image/sirinbababuton.png" alt="Şirin Baba">
            </div>
            <div class="character-btn" data-character="sirine">
                <img src="image/sirinebuton.png" alt="Şirine">
            </div>
            <div class="character-btn" data-character="gozluklu">
                <img src="image/gozluklubuton.png" alt="Gözlüklü">
            </div>
            <div class="character-btn" data-character="gargamel">
                <img src="image/gargamelbuton.png" alt="Gargamel">
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.character-btn');
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const largeImages = document.querySelectorAll('.character-img');

        function activateCharacter(btn) {
            const character = btn.dataset.character;
            const names = {
                'sirinbaba': 'Şirin Baba',
                'sirine': 'Şirine',
                'gozluklu': 'Gözlüklü',
                'gargamel': 'Gargamel'
            };

            // 1. Küçük buton animasyonu
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 1500);

            // 2. Büyük resmi göster ve animasyonu başlat
            largeImages.forEach(img => img.classList.remove('active'));
            const activeImg = document.getElementById(`img-${character}`);
            if (activeImg) {
                activeImg.classList.add('active');
            }

            // 3. Durum mesajı
            showStatus(`${names[character]} ile konuşuyorsunuz! `);
        }

        function showStatus(text) {
            statusText.textContent = text;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 2500);
        }

        // Buton tıklamaları
        buttons.forEach(btn => {
            btn.addEventListener('click', () => activateCharacter(btn));
        });

        // Sesli komut sistemi
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add('listening');
                    showStatus('️ Dinliyorum... Bir karakter ismi söyleyin!');
                } catch(e) { console.log('Hata:', e); }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                micBtn.classList.remove('listening');
                
                const characterMap = {
                    'şirin baba': 'sirinbaba', 'sirin baba': 'sirinbaba',
                    'şirine': 'sirine', 'sirine': 'sirine',
                    'gözlüklü': 'gozluklu', 'gozluklu': 'gozluklu',
                    'gargamel': 'gargamel'
                };

                let found = false;
                for (let key in characterMap) {
                    if (transcript.includes(key)) {
                        const btn = document.querySelector(`[data-character="${characterMap[key]}"]`);
                        if (btn) { activateCharacter(btn); found = true; break; }
                    }
                }
                if (!found) showStatus(`"${transcript}" - Karakter bulunamadı!`);
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                if (event.error !== 'no-speech') showStatus('Ses hatası: ' + event.error);
            };

            recognition.onend = () => micBtn.classList.remove('listening');
        } else {
            micBtn.style.display = 'none';
        }
    </script>
</body>
</html>
