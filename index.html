<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            width: 100%;
            height: 100%;
            background: url('image/buyulukoy.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .mic-icon {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s;
            background: rgba(255, 255, 255, 0.2);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .mic-icon:hover {
            transform: translateX(-50%) scale(1.2);
            background: rgba(255, 255, 255, 0.3);
        }

        .mic-icon.listening {
            animation: pulse 1s infinite;
            background: rgba(255, 80, 80, 0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        .buttons-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .character-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background: transparent;
            padding: 0;
        }

        .character-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .character-btn.active {
            animation: popOut 0.5s ease;
            transform: scale(1.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 100;
            border-color: #FFD700;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1.3); }
        }

        .character-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .character-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            pointer-events: none;
        }

        .character-btn.active .character-label {
            bottom: -35px;
            font-size: 1em;
        }

        .status-text {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .status-text.show {
            opacity: 1;
        }

        /* Mobil uyumluluk */
        @media (max-width: 600px) {
            .character-btn {
                width: 80px;
                height: 80px;
            }
            .buttons-container {
                gap: 10px;
                bottom: 20px;
            }
            .character-label {
                font-size: 0.75em;
                bottom: -25px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="mic-icon" id="micBtn"></div>
        
        <div class="status-text" id="statusText"></div>

        <div class="buttons-container">
            <div class="character-btn" data-character="sirinbaba">
                <img src="image/sirinbababuton.png" alt="Şirin Baba">
                <div class="character-label">Şirin Baba</div>
            </div>
            
            <div class="character-btn" data-character="sirine">
                <img src="image/sirinebuton.png" alt="Şirine">
                <div class="character-label">Şirine</div>
            </div>
            
            <div class="character-btn" data-character="gozluklu">
                <img src="image/gozluklubuton.png" alt="Gözlüklü">
                <div class="character-label">Gözlüklü</div>
            </div>
            
            <div class="character-btn" data-character="gargamel">
                <img src="image/gargamelbuton.png" alt="Gargamel">
                <div class="character-label">Gargamel</div>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.character-btn');
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');

        // Buton tıklama animasyonu
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                activateCharacter(this);
            });
        });

        function activateCharacter(btn) {
            // Tüm butonlardan active sınıfını kaldır
            buttons.forEach(b => b.classList.remove('active'));
            
            // Tıklanan butona active sınıfı ekle
            btn.classList.add('active');
            
            const character = btn.dataset.character;
            const label = btn.querySelector('.character-label').textContent;
            showStatus(`${label} seçildi!`);
            
            // 2 saniye sonra active sınıfını kaldır
            setTimeout(() => {
                btn.classList.remove('active');
            }, 2000);
        }

        function showStatus(text) {
            statusText.textContent = text;
            statusText.classList.add('show');
            
            setTimeout(() => {
                statusText.classList.remove('show');
            }, 2000);
        }

        // Sesli komut sistemi
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add('listening');
                    showStatus('🎙️ Dinleniyor... Bir karakter ismi söyleyin!');
                } catch(e) {
                    console.log('Ses tanıma başlatılamadı:', e);
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                micBtn.classList.remove('listening');
                
                // Karakter isimlerini eşleştir
                const characterMap = {
                    'şirin baba': 'sirinbaba',
                    'sirin baba': 'sirinbaba',
                    'şirine': 'sirine',
                    'sirine': 'sirine',
                    'gözlüklü': 'gozluklu',
                    'gozluklu': 'gozluklu',
                    'gargamel': 'gargamel'
                };

                let found = false;
                for (let key in characterMap) {
                    if (transcript.includes(key)) {
                        const characterName = characterMap[key];
                        const btn = document.querySelector(`[data-character="${characterName}"]`);
                        if (btn) {
                            activateCharacter(btn);
                            found = true;
                            break;
                        }
                    }
                }

                if (!found) {
                    showStatus(`"${transcript}" - Karakter bulunamadı!`);
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                if (event.error !== 'no-speech') {
                    showStatus('Ses tanıma hatası: ' + event.error);
                }
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            micBtn.style.display = 'none';
            console.log('Tarayıcınız ses tanımayı desteklemiyor.');
        }
    </script>
</body>
</html>
