<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('resim/background1.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Üst Mikrofon Durum İkonu */
    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 300;
      transition: all 0.3s;
    }
    .mic-indicator.listening { background: #44bd32; animation: pulse 1s infinite; }
    .mic-indicator.thinking { background: #fbc531; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* SAHNE DÜZENİ VE POZİSYONLAR */
    .character-stage {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 10;
    }

    /* Tüm Karakter Görselleri Ortak Stil */
    .big-char {
      position: absolute;
      bottom: 0;
      height: 48vh;
      max-width: 22vw;
      object-fit: contain;
      cursor: pointer;
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0.4;
      filter: grayscale(40%) brightness(0.8);
      z-index: 10;
    }

    /* Karakter Pozisyonları (Varsayılan Düzen) */
    .pos-far-left { left: 5%; transform: scale(0.8); }
    .pos-left     { left: 25%; transform: scale(0.85); }
    .pos-right    { right: 25%; transform: scale(0.85); }
    .pos-far-right{ right: 5%; transform: scale(0.8); }

    /* MERKEZDEKİ / ÖNE GELEN KARAKTER */
    .big-char.active {
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) scale(1.2) translateY(-10px) !important;
      height: 65vh;
      opacity: 1;
      filter: grayscale(0%) brightness(1) drop-shadow(0 10px 25px rgba(255, 255, 255, 0.9));
      z-index: 100; /* Diğerlerinin önünde yer alır */
    }

    /* ALTTAKİ KÜÇÜK BUTONLAR */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 200;
    }

    .char-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: #ffffff;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s ease;
      opacity: 0.7;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .char-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .char-btn.active {
      opacity: 1;
      border-color: #fbc531;
      transform: scale(1.15);
      box-shadow: 0 0 15px rgba(251, 197, 49, 0.9);
    }
  </style>
</head>
<body>

  <div class="mic-indicator" id="micBtn">🎤</div>

  <!-- BÜYÜK KARAKTER GÖRSELLERİ -->
  <div class="character-stage">
    <!-- Varsayılan olarak Şirin Baba Merkezde (active) -->
    <img src="resim/sirinbaba.png" alt="Şirin Baba" class="big-char active" id="char-sirinbaba" onclick="switchCharacter('Şirin Baba')">
    <img src="resim/sirine.png" alt="Şirine" class="big-char pos-far-left" id="char-sirine" onclick="switchCharacter('Şirine')">
    <img src="resim/gargamel.png" alt="Gargamel" class="big-char pos-far-right" id="char-gargamel" onclick="switchCharacter('Gargamel')">
    <img src="resim/gozluklu.png" alt="Gözlüklü Şirin" class="big-char pos-right" id="char-gozluklu" onclick="switchCharacter('Gözlüklü Şirin')">
  </div>

  <!-- ALT KÜÇÜK BUTONLAR -->
  <div class="bottom-bar">
    <button class="char-btn active" id="btn-sirinbaba" onclick="switchCharacter('Şirin Baba')">
      <img src="resim/sirinbababuton.png" alt="Şirin Baba">
    </button>
    <button class="char-btn" id="btn-sirine" onclick="switchCharacter('Şirine')">
      <img src="resim/sirinebuton.png" alt="Şirine">
    </button>
    <button class="char-btn" id="btn-gargamel" onclick="switchCharacter('Gargamel')">
      <img src="resim/gargamelbuton.png" alt="Gargamel">
    </button>
    <button class="char-btn" id="btn-gozluklu" onclick="switchCharacter('Gözlüklü Şirin')">
      <img src="resim/gozluklubuton.png" alt="Gözlüklü Şirin">
    </button>
  </div>

  <script>
    const GEMINI_API_KEY = "BURAYA_GEMINI_API_KEYINIZI_YAPIŞTIRIN";

    let activeChar = "Şirin Baba";
    let isSpeaking = false;
    let isThinking = false;

    const micBtn = document.getElementById('micBtn');

    // Her karakterin öne geçmediği anlarda sahnedeki duracağı yer sınıfı
    const defaultPositions = {
      "Şirin Baba": "pos-left",
      "Şirine": "pos-far-left",
      "Gargamel": "pos-far-right",
      "Gözlüklü Şirin": "pos-right"
    };

    const charPrompts = {
      "Şirin Baba": "Sen Şirinler köyünün bilge lideri Şirin Baba'sın. SADECE TÜRKÇE KONUŞ. Karşındaki küçük bir çocuk. Ona babacan, sevecen, eğitici ve tatlı bir dille cevap ver. Yanıtların 2-3 cümleyi geçmesin.",
      "Şirine": "Sen Şirinler köyündeki Şirine'sin. SADECE TÜRKÇE KONUŞ. Çok neşeli, tatlı, nazik ve enerjiksin. Yanıtların çocuksu ve neşeli Türkçe olsun. En fazla 2-3 cümle yaz.",
      "Gargamel": "Sen Şirinler'in düşmanı komik Gargamel'sin. SADECE TÜRKÇE KONUŞ. Huysuz ama eğlenceli konuş. Şirinleri yakalama planlarından bahset ama çocuğu güldürecek tatlılıkta olsun. Kısa cevap ver.",
      "Gözlüklü Şirin": "Sen Her şeyi bildiğini sanan Gözlüklü Şirin'sin. SADECE TÜRKÇE KONUŞ. 'Şirin Baba her zaman der ki...' gibi ifadeler kullan. Bilgiç ama tatlı konuş. Kısa cevap ver."
    };

    // Karakter Yer Değiştirme Mantığı
    function switchCharacter(name) {
      if (activeChar === name) return;

      const prevChar = activeChar;
      activeChar = name;

      // 1. Önceki aktif karakteri sıradaki yan pozisyonuna kaydır
      const prevEl = getCharElement(prevChar);
      if (prevEl) {
        prevEl.classList.remove('active');
        prevEl.className = `big-char ${defaultPositions[prevChar]}`;
      }

      // 2. Yeni çağrılan karakteri doğrudan MERKEZE getir (active)
      const newEl = getCharElement(name);
      if (newEl) {
        newEl.className = 'big-char active';
      }

      // 3. Alt küçük buton aktifliğini güncelle
      document.querySelectorAll('.char-btn').forEach(el => el.classList.remove('active'));
      const btnId = getBtnId(name);
      if (btnId) document.getElementById(btnId).classList.add('active');

      speakText(`Merhaba! Ben ${activeChar}, seninle sohbet etmek için geldim!`);
    }

    function getCharElement(name) {
      if (name === 'Şirin Baba') return document.getElementById('char-sirinbaba');
      if (name === 'Şirine') return document.getElementById('char-sirine');
      if (name === 'Gargamel') return document.getElementById('char-gargamel');
      if (name === 'Gözlüklü Şirin') return document.getElementById('char-gozluklu');
      return null;
    }

    function getBtnId(name) {
      if (name === 'Şirin Baba') return 'btn-sirinbaba';
      if (name === 'Şirine') return 'btn-sirine';
      if (name === 'Gargamel') return 'btn-gargamel';
      if (name === 'Gözlüklü Şirin') return 'btn-gozluklu';
      return null;
    }

    // Sesli Komut Kontrolü
    function checkVoiceCharacterSwitch(userText) {
      const text = userText.toLowerCase();

      if ((text.includes("şirin baba") || text.includes("baba")) && activeChar !== "Şirin Baba") {
        switchCharacter("Şirin Baba");
        return true;
      }
      if (text.includes("şirine") && activeChar !== "Şirine") {
        switchCharacter("Şirine");
        return true;
      }
      if (text.includes("gargamel") && activeChar !== "Gargamel") {
        switchCharacter("Gargamel");
        return true;
      }
      if ((text.includes("gözlüklü") || text.includes("gözlük")) && activeChar !== "Gözlüklü Şirin") {
        switchCharacter("Gözlüklü Şirin");
        return true;
      }
      return false;
    }

    // Gemini API Yanıtı
    async function getAIResponse(userText) {
      micBtn.className = "mic-indicator thinking";
      isThinking = true;

      const systemPrompt = charPrompts[activeChar];
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nÇocuğun söylediği: "${userText}"` }]
            }]
          })
        });

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "Seni tam duyamadım küçük dostum, tekrar söyler misin?";
      } finally {
        isThinking = false;
      }
    }

    // Seslendirme
    function speakText(text) {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';

      if (activeChar === "Şirin Baba") { utterance.pitch = 0.8; utterance.rate = 0.9; }
      else if (activeChar === "Şirine") { utterance.pitch = 1.4; utterance.rate = 1.0; }
      else if (activeChar === "Gargamel") { utterance.pitch = 0.6; utterance.rate = 1.1; }
      else if (activeChar === "Gözlüklü Şirin") { utterance.pitch = 1.2; utterance.rate = 1.1; }

      isSpeaking = true;
      stopListening();

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    // Ses Tanıma
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking && !isThinking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim();
        if(!text) return;

        const characterChanged = checkVoiceCharacterSwitch(text);

        if (!characterChanged) {
          const aiResponse = await getAIResponse(text);
          speakText(aiResponse);
        }
      };

      window.onload = () => { startListening(); };
    }

    function stopListening() { 
      micBtn.className = "mic-indicator";
      if(recognition) try{ recognition.stop(); }catch(e){} 
    }
    
    function startListening() { 
      if(recognition && !isSpeaking && !isThinking) {
        micBtn.className = "mic-indicator listening";
        try{ recognition.start(); }catch(e){} 
      }
    }
  </script>
</body>
</html>
