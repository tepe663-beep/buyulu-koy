<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirinler AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;font-family:Arial,sans-serif}
.background{width:100%;height:100%;background:url('image/background.png') no-repeat center center;background-size:cover;position:relative}
.mic-icon{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:3em;cursor:pointer;z-index:20;background:rgba(255,255,255,0.25);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.5)}
.mic-icon.listening{background:rgba(255,80,80,0.5);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.3)}}
.character-display-container{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:100%;height:70vh;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
.character-img{position:absolute;max-height:70vh;max-width:90vw;opacity:0;visibility:hidden;transform:scale(0.5);transition:all 0.5s;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4))}
.character-img.active{opacity:1;visibility:visible;transform:scale(1);animation:dance 2s infinite}
@keyframes dance{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-20px) scale(1.04)}50%{transform:translateY(0) scale(0.96)}75%{transform:translateY(-15px) scale(1.03)}}
.buttons-container{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:25px;z-index:10;flex-wrap:wrap;justify-content:center}
.character-btn{width:100px;height:100px;border-radius:50%;border:none;cursor:pointer;transition:all 0.4s;box-shadow:0 6px 20px rgba(0,0,0,0.3);background:transparent}
.character-btn:hover{transform:translateY(-10px) scale(1.08)}
.character-btn.active{animation:pop 0.6s;transform:scale(1.2);box-shadow:0 15px 40px rgba(255,215,0,0.6);z-index:100}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1.2)}}
.character-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.status{position:absolute;top:120px;left:50%;transform:translateX(-50%);color:#fff;font-size:1.3em;font-weight:bold;text-shadow:2px 2px 6px rgba(0,0,0,0.5);z-index:20;opacity:0;transition:opacity 0.3s;background:rgba(0,0,0,0.35);padding:12px 24px;border-radius:25px}
.status.show{opacity:1}
.api-status{position:absolute;top:30px;right:30px;background:rgba(0,0,0,0.5);color:#fff;padding:8px 15px;border-radius:15px;font-size:0.85em;z-index:20}
</style>
</head>
<body>
<div class="background">
<div class="mic-icon" id="micBtn"></div>
<div class="api-status" id="apiStatus">Hazir</div>
<div class="status" id="status"></div>
<div class="character-display-container">
<img src="image/sirinbababuyuk.png" id="img-sirinbaba" class="character-img">
<img src="image/sıirenebuyuk.png" id="img-sirine" class="character-img">
<img src="image/gozluklubuyuk.png" id="img-gozluklu" class="character-img">
<img src="image/gargamelbuyuk.png" id="img-gargamel" class="character-img">
</div>
<div class="buttons-container">
<div class="character-btn" data-char="sirinbaba"><img src="image/sirinbababuton.png"></div>
<div class="character-btn" data-char="sirine"><img src="image/sirinebuton.png"></div>
<div class="character-btn" data-char="gozluklu"><img src="image/gozluklubuton.png"></div>
<div class="character-btn" data-char="gargamel"><img src="image/gargamelbuton.png"></div>
</div>
</div>
<script>
var FISH_KEY='sk-fish-bHCj5Oiy6cM6Y8v5hp14-5TrOxLDm74lDST3LG-Nzyc';
var GROQ_KEY='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';
var VOICES={sirinbaba:'8ddd7f4580f44b979185b3e20c612612',sirine:'56051e80b2064ca1ac1aca565ff69654',gozluklu:'1d6c5ef2e9fb41749b42caa13d59c088'};
var NAMES={sirinbaba:'Sirin Baba',sirine:'Sirine',gozluklu:'Gozluklu',gargamel:'Gargamel'};
var PROMPTS={sirinbaba:'Sen Sirin Baba\'sin. Bilge, sefkatli bir sirinsin. Turkce, kisa cevaplar ver.',sirine:'Sen Sirine\'sin. Neseli, tatli bir sirinsin. Turkce, kisa cevaplar ver.',gozluklu:'Sen Gozluklu Sirin\'sin. Zeki, bilgili bir sirinsin. Turkce, kisa cevaplar ver.',gargamel:'Sen Gargamel\'sin. Huysuz bir buyucusun. Turkce, kisa cevaplar ver.'};
var currentChar=null;
var history={};

function show(txt){var s=document.getElementById('status');s.textContent=txt;s.classList.add('show');setTimeout(function(){s.classList.remove('show')},2500)}

function speakBrowser(text,char){
if(!window.speechSynthesis){show('Tarayici ses desteklemiyor');return}
window.speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(text);
u.lang='tr-TR';
if(char==='sirinbaba'){u.pitch=0.7;u.rate=0.9}
else if(char==='sirine'){u.pitch=1.3;u.rate=1.1}
else if(char==='gozluklu'){u.pitch=1.1;u.rate=1.2}
else if(char==='gargamel'){u.pitch=0.5;u.rate=0.8}
u.onstart=function(){document.getElementById('apiStatus').textContent='Konusuyor...'}
u.onend=function(){document.getElementById('apiStatus').textContent='Hazir'}
window.speechSynthesis.speak(u)
}

async function speakFish(text,char){
if(!VOICES[char]){speakBrowser(text,char);return}
try{
document.getElementById('apiStatus').textContent='Fish API deneniyor...';
var proxyUrl='https://api.allorigins.win/raw?url=';
var targetUrl='https://fish.audio/api/v1/tts';
var finalUrl=proxyUrl+encodeURIComponent(targetUrl);
var r=await fetch(finalUrl,{method:'POST',headers:{'Authorization':'Bearer '+FISH_KEY,'Content-Type':'application/json','Origins':'*'},body:JSON.stringify({text:text,format:'mp3_44100_128',model_id:VOICES[char]})});
if(!r.ok)throw new Error('API hatasi: '+r.status);
var blob=await r.blob();
if(blob.size<100)throw new Error('Bos ses');
var url=URL.createObjectURL(blob);
var audio=new Audio(url);
audio.play();
audio.onended=function(){URL.revokeObjectURL(url);document.getElementById('apiStatus').textContent='Hazir'}
audio.onerror=function(){speakBrowser(text,char)}
}catch(e){
console.log('Fish.audio basarisiz, browser TTS:',e.message);
document.getElementById('apiStatus').textContent='Browser TTS';
speakBrowser(text,char)
}
}

async function ask(char,question){
if(!history[char])history[char]=[{role:'system',content:PROMPTS[char]}];
history[char].push({role:'user',content:question});
try{
var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+GROQ_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.1-8b-instant',messages:history[char],max_tokens:150})});
var data=await r.json();
var reply=data.choices[0].message.content;
history[char].push({role:'assistant',content:reply});
speakFish(reply,char)
}catch(e){
console.error(e);
speakBrowser('Uzgunum, hata olustu.',char)
}
}

document.querySelectorAll('.character-btn').forEach(function(btn){
btn.onclick=function(){
var c=btn.getAttribute('data-char');
currentChar=c;
document.querySelectorAll('.character-btn').forEach(function(b){b.classList.remove('active')});
btn.classList.add('active');
setTimeout(function(){btn.classList.remove('active')},1500);
document.querySelectorAll('.character-img').forEach(function(img){img.classList.remove('active')});
var img=document.getElementById('img-'+c);
if(img){img.classList.add('active');console.log(c+' gorseli aktif')}
else{console.error(c+' gorseli bulunamadi!')}
if(!history[c])history[c]=[{role:'system',content:PROMPTS[c]}];
show(NAMES[c]+' hazir!');
document.getElementById('apiStatus').textContent='Dusunuyor...';
var greet={sirinbaba:'Merhaba! Ben Sirin Baba.',sirine:'Selam! Ben Sirine!',gozluklu:'Merhaba! Ben Gozluklu.',gargamel:'Ben Gargamel!'};
speakFish(greet[c],c)
}
});

if('webkitSpeechRecognition' in window){
var rec=new webkitSpeechRecognition();
rec.lang='tr-TR';
document.getElementById('micBtn').onclick=function(){
if(!currentChar){show('Once karakter sec');return}
rec.start();this.classList.add('listening');show('Dinliyorum...')
};
rec.onresult=function(e){
var txt=e.results[0][0].transcript;
document.getElementById('micBtn').classList.remove('listening');
show(txt);ask(currentChar,txt)
};
rec.onerror=function(){document.getElementById('micBtn').classList.remove('listening')}
}else{document.getElementById('micBtn').style.display='none'}

document.getElementById('apiStatus').textContent='Hazir (Browser TTS)';
console.log('Yuklendi. Resimler:',{sirinbaba:'image/sirinbababuyuk.png',sirine:'image/sıirenebuyuk.png',gozluklu:'image/gozluklubuyuk.png'});
</script>
</body>
</html>
