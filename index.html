<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Köyü Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      /* Arka plan görseliniz */
      background: url('resim/background.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Üst Mikrofon Durum İkonu */
    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      transition: all 0.3s;
      cursor: pointer;
    }
    .mic-indicator.listening {
      background: #44bd32;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* 
      Alt Tıklama Alanları:
      Arka plandaki 5 dairenin (Şirin Baba, Şirine, Gargamel, Azman, Gözlüklü) 
      üzerine tam oturacak şekilde şeffaf butonlar
    */
    .bottom-bar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      width: 82%; /* Arka plandaki dairelerin mesafesine göre ayarlandı */
      max-width: 900px;
      z-index: 100;
    }

    .char-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    /* Tıklanan karakterin etrafında sarı halka belirir */
    .char-btn.active {
      border-color: #fbc531;
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(251, 197, 49, 0.8);
    }
  </style>
</head>
<body>

  <div class="mic-indicator listening" id="micBtn">🎤</div>

  <!-- Alt Taraftaki Arka Plan Dairelerine Denk Gelen 5 Buton -->
  <div class="bottom-bar">
    <div class="char-btn active" onclick="switchCharacter('Şirin Baba')" title="Şirin Baba"></div>
    <div class="char-btn" onclick="switchCharacter('Şirine')" title="Şirine"></div>
    <div class="char-btn" onclick="switchCharacter('Gargamel')" title="Gargamel"></div>
    <div class="char-btn" onclick="switchCharacter('Azman')" title="Azman"></div>
    <div class="char-btn" onclick="switchCharacter('Gözlüklü Şirin')" title="Gözlüklü Şirin"></div>
  </div>

  <script>
    let activeChar = "Şirin Baba";
    let isSpeaking = false;

    const micBtn = document.getElementById('micBtn');

    // KARAKTER SES VE KİŞİLİK AYARLARI
    const charSettings = {
      "Şirin Baba": {
        pitch: 0.7, // Tok, yaşlı erkek sesi
        rate: 0.8,  // Yavaş ve babacan
        welcome: "Merhaba küçük dostum! Ben Şirin Baba."
      },
      "Şirine": {
        pitch: 1.6, // İnce, neşeli kadın/kız sesi
        rate: 0.9,
        welcome: "Ayy merhaba! Ben Şirine, seninle oynamak çok güzel!"
      },
      "Gargamel": {
        pitch: 0.5, // Kaba ve kıkırdayan ses
        rate: 0.95,
        welcome: "Hahaha! Ben Gargamel! Seni yakalayacağım Şirin!"
      },
      "Azman": {
        pitch: 1.8, // Kedi sesi / yüksek frekans
        rate: 1.1,
        welcome: "Miyavvv! Ben Azman, Şirinleri avlamaya hazırım!"
      },
      "Gözlüklü Şirin": {
        pitch: 1.3, // Bilgiç, hafif ince ses
        rate: 1.0,
        welcome: "Şirin Baba her zaman der ki: Konuşmak çok güzeldir!"
      }
    };

    // KARAKTER DEĞİŞTİRME MANTIĞI
    function switchCharacter(name) {
      activeChar = name;
      
      // Tüm butonların aktiflik çizgisini temizle
      const buttons = document.querySelectorAll('.char-btn');
      buttons.forEach(el => el.classList.remove('active'));

      // Seçilen butona sarı halka ekle
      const activeData = charSettings[name];
      if(activeData) {
        if(name === 'Şirin Baba') buttons[0].classList.add('active');
        if(name === 'Şirine') buttons[1].classList.add('active');
        if(name === 'Gargamel') buttons[2].classList.add('active');
        if(name === 'Azman') buttons[3].classList.add('active');
        if(name === 'Gözlüklü Şirin') buttons[4].classList.add('active');

        speakText(activeData.welcome);
      }
    }

    // SES TANIMA (Mikrofon Daima Açık)
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
        
        // Sesle Karakter Çağırma Kontrolü
        if (text.includes("şirin baba")) { switchCharacter("Şirin Baba"); return; }
        if (text.includes("şirine")) { switchCharacter("Şirine"); return; }
        if (text.includes("gargamel")) { switchCharacter("Gargamel"); return; }
        if (text.includes("azman")) { switchCharacter("Azman"); return; }
        if (text.includes("gözlüklü")) { switchCharacter("Gözlüklü Şirin"); return; }

        // Normal Konuşma
        if (text.length > 1) {
          await processResponse(text);
        }
      };

      window.onload = () => { try { recognition.start(); } catch(e){} };
    }

    async function processResponse(userInput) {
      stopListening();
      
      let aiText = `${activeChar}: Seni duyabiliyorum küçük dostum!`;
      if(activeChar === "Gargamel") {
        aiText = "Gargamel: Yakalayacağım seni küçük Şirin!";
      } else if(activeChar === "Azman") {
        aiText = "Azman: Miyavvv! Şirinleri bana ver!";
      }

      speakText(aiText);
    }

    // KARAKTERE ÖZGÜ SES TONU İLE KONUŞMA (TTS)
    function speakText(text) {
      isSpeaking = true;
      stopListening();

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';

      const currentConfig = charSettings[activeChar];
      if (currentConfig) {
        utterance.pitch = currentConfig.pitch;
        utterance.rate = currentConfig.rate;
      }

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopListening() { if(recognition) try{ recognition.stop(); }catch(e){} }
    function startListening() { if(recognition && !isSpeaking) try{ recognition.start(); }catch(e){} }
  </script>
</body>
</html>
