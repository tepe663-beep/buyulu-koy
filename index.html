<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            width: 100%;
            height: 100%;
            background: url('image/background.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .mic-icon {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.25);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 3px solid rgba(255,255,255,0.5);
        }

        .mic-icon:hover {
            transform: translateX(-50%) scale(1.15);
            background: rgba(255, 255, 255, 0.35);
        }

        .mic-icon.listening {
            animation: pulse 1s infinite;
            background: rgba(255, 80, 80, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        .character-display-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }

        .character-img {
            position: absolute;
            max-height: 70vh;
            max-width: 90vw;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.5);
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        .character-img.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            animation: danceTalk 2s infinite ease-in-out;
        }

        @keyframes danceTalk {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-20px) scale(1.04) rotate(-4deg); }
            50% { transform: translateY(0) scale(0.96) rotate(0deg); }
            75% { transform: translateY(-15px) scale(1.03) rotate(4deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        .buttons-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .character-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: transparent;
            padding: 0;
        }

        .character-btn:hover {
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .character-btn.active {
            animation: popOut 0.6s ease;
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
            z-index: 100;
        }

        @keyframes popOut {
            0% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.4) translateY(-20px); }
            100% { transform: scale(1.2) translateY(-10px); }
        }

        .character-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .status-text {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0,0,0,0.35);
            padding: 12px 24px;
            border-radius: 25px;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .status-text.show {
            opacity: 1;
        }

        /* Ses Kontrol Butonu */
        .sound-toggle {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 2em;
            cursor: pointer;
            z-index: 20;
            background: rgba(255, 255, 255, 0.25);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.5);
            transition: all 0.3s;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.35);
        }

        .sound-toggle.muted {
            opacity: 0.5;
        }

        /* Konuşma Balonu */
        .speech-bubble {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #333;
            padding: 20px 30px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: bold;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 15;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        .speech-bubble.show {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 650px) {
            .buttons-container { gap: 15px; bottom: 20px; }
            .character-btn { width: 75px; height: 75px; }
            .character-img { max-height: 55vh; }
            .speech-bubble { font-size: 1em; padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="mic-icon" id="micBtn">🎤</div>
        <div class="sound-toggle" id="soundToggle"></div>
        <div class="status-text" id="statusText"></div>
        <div class="speech-bubble" id="speechBubble"></div>

        <!-- Büyük Karakter Görselleri -->
        <div class="character-display-container">
            <img src="image/sirinbababuyuk.png" alt="Şirin Baba" class="character-img" id="img-sirinbaba">
            <img src="image/sıirinebuyuk.png" alt="Şirine" class="character-img" id="img-sirine">
            <img src="image/gozluklubuyuk.png" alt="Gözlüklü" class="character-img" id="img-gozluklu">
            <img src="image/gargamelbuyuk.png" alt="Gargamel" class="character-img" id="img-gargamel">
        </div>

        <!-- Alt Küçük Butonlar -->
        <div class="buttons-container">
            <div class="character-btn" data-character="sirinbaba">
                <img src="image/sirinbababuton.png" alt="Şirin Baba">
            </div>
            <div class="character-btn" data-character="sirine">
                <img src="image/sirinebuton.png" alt="Şirine">
            </div>
            <div class="character-btn" data-character="gozluklu">
                <img src="image/gozluklubuton.png" alt="Gözlüklü">
            </div>
            <div class="character-btn" data-character="gargamel">
                <img src="image/gargamelbuton.png" alt="Gargamel">
            </div>
        </div>
    </div>

    <!-- Ses Elementleri -->
    <audio id="audio-sirinbaba" preload="auto">
        <source src="audio/sirinbaba.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-sirine" preload="auto">
        <source src="audio/sirine.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-gozluklu" preload="auto">
        <source src="audio/gozlulu.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-gargamel" preload="auto">
        <source src="audio/gargamel.mp3" type="audio/mpeg">
    </audio>

    <script>
        const buttons = document.querySelectorAll('.character-btn');
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const largeImages = document.querySelectorAll('.character-img');
        const soundToggle = document.getElementById('soundToggle');
        const speechBubble = document.getElementById('speechBubble');
        
        let isMuted = false;
        let currentCharacter = null;
        let speechSynthesis = window.speechSynthesis;

        // Ses dosyaları
        const audioFiles = {
            'sirinbaba': document.getElementById('audio-sirinbaba'),
            'sirine': document.getElementById('audio-sirine'),
            'gozluklu': document.getElementById('audio-gozluklu'),
            'gargamel': document.getElementById('audio-gargamel')
        };

        // Karakter bilgileri
        const characterInfo = {
            'sirinbaba': { name: 'Şirin Baba', voice: 'TR-TR', pitch: 0.8, rate: 0.9 },
            'sirine': { name: 'Şirine', voice: 'TR-TR', pitch: 1.2, rate: 1.0 },
            'gozluklu': { name: 'Gözlüklü', voice: 'TR-TR', pitch: 1.0, rate: 1.1 },
            'gargamel': { name: 'Gargamel', voice: 'TR-TR', pitch: 0.6, rate: 0.85 }
        };

        // Örnek cevaplar (Bunu daha sonra API ile değiştirebilirsiniz)
        const sampleResponses = {
            'sirinbaba': [
                'Merhaba küçük şirin! Nasılsın?',
                'Ben Şirin Baba, size nasıl yardımcı olabilirim?',
                'Şirinler köyüne hoş geldin!',
                'Akıllıca bir soru sordun!'
            ],
            'sirine': [
                'Selam! Ben Şirine, ne yapmak istersin?',
                'Çok tatlısın! Seninle konuşmak güzel!',
                'Bugün çok neşeliyim!',
                'Şirinler köyünde harika bir gün!'
            ],
            'gozluklu': [
                'Merhaba! Ben Gözlüklü Şirin!',
                'Kitap okumayı çok severim!',
                'Bilgili biri olarak sana yardımcı olayım!',
                'İlginç bir soru!'
            ],
            'gargamel': [
                'Kahkahaa! Ben Gargamel!',
                'Şirinleri yakalayacağım!',
                'Kedim Azman ile buradayım!',
                'Hahaha, ne istiyorsun?'
            ]
        };

        // Resim yükleme kontrolleri
        largeImages.forEach(img => {
            img.addEventListener('error', () => console.error('❌ Resim yüklenemedi:', img.src));
            img.addEventListener('load', () => console.log('✅ Resim yüklendi:', img.src));
        });

        // Ses açma/kapama
        soundToggle.addEventListener('click', () => {
            isMuted = !isMuted;
            soundToggle.textContent = isMuted ? '🔇' : '';
            soundToggle.classList.toggle('muted');
            
            if (isMuted) {
                Object.values(audioFiles).forEach(audio => {
                    audio.pause();
                    audio.muted = true;
                });
                speechSynthesis.cancel();
            } else {
                Object.values(audioFiles).forEach(audio => {
                    audio.muted = false;
                });
            }
        });

        function activateCharacter(btn) {
            const character = btn.dataset.character;
            currentCharacter = character;
            const info = characterInfo[character];

            // Buton animasyonu
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 1500);

            // Büyük resmi göster
            largeImages.forEach(img => img.classList.remove('active'));
            const activeImg = document.getElementById(`img-${character}`);
            if (activeImg) {
                setTimeout(() => activeImg.classList.add('active'), 50);
            }

            // Ses çal
            playCharacterSound(character);

            // Konuşma balonu göster
            showSpeechBubble(`${info.name} size sesleniyor...`);
            
            showStatus(`${info.name} ile konuşuyorsunuz!`);
        }

        function playCharacterSound(character) {
            if (isMuted) return;

            // Önce MP3 dosyasını çalmayı dene
            const audio = audioFiles[character];
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(err => {
                    console.log('MP3 çalınamadı, TTS kullanılıyor:', err);
                    // MP3 çalınamazsa TTS kullan
                    speakWithTTS(character, `${characterInfo[character].name} merhaba!`);
                });
                
                // MP3 bittiğinde TTS ile devam et (opsiyonel)
                audio.onended = () => {
                    // İsterseniz burada otomatik TTS başlatabilirsiniz
                };
            }
        }

        function speakWithTTS(character, text) {
            if (isMuted || !speechSynthesis) return;

            // Önceki konuşmayı durdur
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            const info = characterInfo[character];
            
            utterance.lang = info.voice;
            utterance.pitch = info.pitch;
            utterance.rate = info.rate;
            utterance.volume = 1;

            // Türkçe sesleri bul
            const voices = speechSynthesis.getVoices();
            const turkishVoice = voices.find(v => v.lang.includes('tr'));
            if (turkishVoice) {
                utterance.voice = turkishVoice;
            }

            speechSynthesis.speak(utterance);
        }

        function showSpeechBubble(text) {
            speechBubble.textContent = text;
            speechBubble.classList.add('show');
            setTimeout(() => speechBubble.classList.remove('show'), 3000);
        }

        function showStatus(text) {
            statusText.textContent = text;
            statusText.classList.add('show');
            setTimeout(() => statusText.classList.remove('show'), 2500);
        }

        // Karakterlere soru sorma (Örnek)
        function askCharacter(character, question) {
            const responses = sampleResponses[character];
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            
            showSpeechBubble(randomResponse);
            speakWithTTS(character, randomResponse);
        }

        // Buton tıklamaları
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                activateCharacter(btn);
                // Örnek: Karakter seçildiğinde rastgele bir cevap ver
                setTimeout(() => {
                    askCharacter(btn.dataset.character);
                }, 1000);
            });
        });

        // Sesli komut
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add('listening');
                    showStatus('🎙️ Dinliyorum... Bir karakter ismi söyleyin!');
                } catch(e) { console.log('Hata:', e); }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                micBtn.classList.remove('listening');
                
                const characterMap = {
                    'şirin baba': 'sirinbaba', 'sirin baba': 'sirinbaba',
                    'şirine': 'sirine', 'sirine': 'sirine',
                    'gözlüklü': 'gozluklu', 'gozluklu': 'gozluklu',
                    'gargamel': 'gargamel'
                };

                let found = false;
                for (let key in characterMap) {
                    if (transcript.includes(key)) {
                        const btn = document.querySelector(`[data-character="${characterMap[key]}"]`);
                        if (btn) { 
                            activateCharacter(btn);
                            setTimeout(() => askCharacter(characterMap[key], transcript), 1000);
                            found = true; 
                            break; 
                        }
                    }
                }
                if (!found) showStatus(`"${transcript}" - Karakter bulunamadı!`);
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                if (event.error !== 'no-speech') showStatus('Ses hatası: ' + event.error);
            };

            recognition.onend = () => micBtn.classList.remove('listening');
        } else {
            micBtn.style.display = 'none';
        }

        // Sesleri yükle
        if (speechSynthesis) {
            speechSynthesis.getVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
            }
        }
    </script>
</body>
</html>
