<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Köyü Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      /* Arka plan görseli */
      background: url('resim/background1.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Üst Mikrofon Durum İkonu */
    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      transition: all 0.3s;
      cursor: pointer;
    }
    .mic-indicator.listening {
      background: #44bd32;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Alt Buton Hizalama Alanı */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 90%;
      max-width: 900px;
      z-index: 100;
    }

    /* Dairesel Butonlar */
    .char-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: #ffffff;
      cursor: pointer;
      overflow: hidden; /* Resmin dışa taşmasını önler */
      transition: all 0.2s ease-in-out;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      padding: 0;
      display: block;
    }

    /* Buton İçindeki Karakter Resimleri */
    .char-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Resmi yuvarlak butonun içine sığdırır */
      border-radius: 50%;
      display: block;
      pointer-events: none;
    }

    /* Tıklanan Buton Stili (Sarı Halka) */
    .char-btn.active {
      border-color: #fbc531;
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(251, 197, 49, 0.9);
    }
  </style>
</head>
<body>

  <div class="mic-indicator listening" id="micBtn">🎤</div>

  <!-- Güncellenmiş Dosya İsimlerine Göre Butonlar -->
  <div class="bottom-bar">
    <button class="char-btn active" onclick="switchCharacter('Şirin Baba')" title="Şirin Baba">
      <img src="resim/sirinbababuton.png" alt="Şirin Baba">
    </button>
    <button class="char-btn" onclick="switchCharacter('Şirine')" title="Şirine">
      <img src="resim/sirinebuton.png" alt="Şirine">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gargamel')" title="Gargamel">
      <img src="resim/gargamelbuton.png" alt="Gargamel">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gözlüklü Şirin')" title="Gözlüklü Şirin">
      <img src="resim/gozluklubuton.png" alt="Gözlüklü Şirin">
    </button>
  </div>

  <script>
    let activeChar = "Şirin Baba";
    let isSpeaking = false;

    const charSettings = {
      "Şirin Baba": { pitch: 0.7, rate: 0.8, welcome: "Merhaba küçük dostum! Ben Şirin Baba." },
      "Şirine": { pitch: 1.6, rate: 0.9, welcome: "Ayy merhaba! Ben Şirine, seninle oynamak çok güzel!" },
      "Gargamel": { pitch: 0.5, rate: 0.95, welcome: "Hahaha! Ben Gargamel! Seni yakalayacağım Şirin!" },
      "Gözlüklü Şirin": { pitch: 1.3, rate: 1.0, welcome: "Şirin Baba her zaman der ki: Konuşmak çok güzeldir!" }
    };

    function switchCharacter(name) {
      activeChar = name;
      
      const buttons = document.querySelectorAll('.char-btn');
      buttons.forEach(el => el.classList.remove('active'));

      const activeData = charSettings[name];
      if(activeData) {
        if(name === 'Şirin Baba') buttons[0].classList.add('active');
        if(name === 'Şirine') buttons[1].classList.add('active');
        if(name === 'Gargamel') buttons[2].classList.add('active');
        if(name === 'Gözlüklü Şirin') buttons[3].classList.add('active');

        speakText(activeData.welcome);
      }
    }

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
        
        if (text.includes("şirin baba")) { switchCharacter("Şirin Baba"); return; }
        if (text.includes("şirine")) { switchCharacter("Şirine"); return; }
        if (text.includes("gargamel")) { switchCharacter("Gargamel"); return; }
        if (text.includes("gözlüklü")) { switchCharacter("Gözlüklü Şirin"); return; }

        if (text.length > 1) {
          await processResponse(text);
        }
      };

      window.onload = () => { try { recognition.start(); } catch(e){} };
    }

    async function processResponse(userInput) {
      stopListening();
      
      let aiText = `${activeChar}: Seni duyabiliyorum küçük dostum!`;
      if(activeChar === "Gargamel") {
        aiText = "Gargamel: Yakalayacağım seni küçük Şirin!";
      }

      speakText(aiText);
    }

    function speakText(text) {
      isSpeaking = true;
      stopListening();

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';

      const currentConfig = charSettings[activeChar];
      if (currentConfig) {
        utterance.pitch = currentConfig.pitch;
        utterance.rate = currentConfig.rate;
      }

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopListening() { if(recognition) try{ recognition.stop(); }catch(e){} }
    function startListening() { if(recognition && !isSpeaking) try{ recognition.start(); }catch(e){} }
  </script>
</body>
</html>
