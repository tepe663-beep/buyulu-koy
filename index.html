<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Köyü Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      /* GitHub'a yüklediğiniz yerel arka plan resmi */
      background: url('resim/background.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Üst Mikrofon Durum İkonu */
    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      transition: all 0.3s;
    }
    .mic-indicator.listening {
      background: #44bd32;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Konuşma Balonu */
    .speech-bubble {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 5px solid #00a8ff;
      border-radius: 30px;
      padding: 20px 30px;
      max-width: 80%;
      width: 500px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #2f3542;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 90;
    }

    /* Sahne ve Öne Çıkan Karakter Alanı */
    .stage {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      height: 60vh;
      pointer-events: none;
    }

    .character-avatar {
      max-height: 80%;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: scale(0.5);
      position: absolute;
    }

    /* Aktif Karakter Öne Fırlar ve Büyür */
    .character-avatar.active {
      opacity: 1;
      transform: scale(1.2);
    }

    /* Gargamel & Azman Birlikte Çıktığında */
    .duo-container {
      display: flex;
      align-items: flex-end;
      gap: -20px;
    }

    /* Alt Karakter Seçim İkonları */
    .bottom-bar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 40px;
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    /* Karakter Butonlarının İçine Resim Oturtma */
    .char-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #fff;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .char-btn.active {
      border-color: #fbc531;
      transform: scale(1.2);
    }

    /* Her Butona Karakter Görselini Bağlama */
    .btn-sirin-baba { background-image: url('https://i.postimg.cc/png-sirin-baba.png'); }
    .btn-sirine     { background-image: url('https://i.postimg.cc/png-sirine.png'); }
    .btn-gargamel   { background-image: url('https://i.postimg.cc/png-gargamel.png'); }
    .btn-gozluklu   { background-image: url('https://i.postimg.cc/png-gozluklu.png'); }
  </style>
</head>
<body>

  <div class="mic-indicator listening" id="micBtn">🎤</div>

  <div class="speech-bubble" id="bubble">
    Bana "Şirin Baba", "Şirine", "Gargamel" veya "Gözlüklü" de!
  </div>

  <!-- ÖNE ÇIKAN KARAKTER SAHNESİ -->
  <div class="stage">
    <img id="img-sirin-baba" class="character-avatar active" src="https://i.postimg.cc/png-sirin-baba.png" alt="Şirin Baba" />
    <img id="img-sirine" class="character-avatar" src="https://i.postimg.cc/png-sirine.png" alt="Şirine" />
    <img id="img-gozluklu" class="character-avatar" src="https://i.postimg.cc/png-gozluklu.png" alt="Gözlüklü Şirin" />
    
    <!-- Gargamel ve Azman Birlikte -->
    <div id="img-gargamel-azman" class="character-avatar duo-container">
      <img src="https://i.postimg.cc/png-gargamel.png" style="height: 350px;" />
      <img src="https://i.postimg.cc/png-azman.png" style="height: 180px; margin-left: -40px;" />
    </div>
  </div>

  <!-- Alt Butonlar (Karakter Resimli) -->
  <div class="bottom-bar">
    <div class="char-btn btn-sirin-baba active" onclick="switchCharacter('Şirin Baba')" title="Şirin Baba"></div>
    <div class="char-btn btn-sirine" onclick="switchCharacter('Şirine')" title="Şirine"></div>
    <div class="char-btn btn-gargamel" onclick="switchCharacter('Gargamel ve Azman')" title="Gargamel ve Azman"></div>
    <div class="char-btn btn-gozluklu" onclick="switchCharacter('Gözlüklü Şirin')" title="Gözlüklü Şirin"></div>
  </div>

  <script>
    let activeChar = "Şirin Baba";
    let isSpeaking = false;

    const bubble = document.getElementById('bubble');
    const micBtn = document.getElementById('micBtn');

    // KARAKTER SES VE KİŞİLİK AYARLARI
    const charSettings = {
      "Şirin Baba": {
        elementId: "img-sirin-baba",
        pitch: 0.7, // Tok, yaşlı erkek sesi
        rate: 0.8,  // Yavaş ve babacan
        welcome: "Merhaba küçük dostum! Ben Şirin Baba."
      },
      "Şirine": {
        elementId: "img-sirine",
        pitch: 1.6, // İnce, neşeli kadın/kız sesi
        rate: 0.9,
        welcome: "Ayy merhaba! Ben Şirine, seninle oynamak çok güzel!"
      },
      "Gargamel ve Azman": {
        elementId: "img-gargamel-azman",
        pitch: 0.5, // Kaba ve kıkırdayan ses
        rate: 0.95,
        welcome: "Hahaha! Ben Gargamel, bu da Azman! Yakaladım seni!"
      },
      "Gözlüklü Şirin": {
        elementId: "img-gozluklu",
        pitch: 1.3, // Bilgiç, hafif ince ses
        rate: 1.0,
        welcome: "Şirin Baba her zaman der ki: Konuşmak çok güzeldir!"
      }
    };

    // KARAKTER DEĞİŞTİRME MANTIĞI (Görseli ve Buton Aktifliğini Ayarlar)
    function switchCharacter(name) {
      activeChar = name;
      
      // Tüm görselleri gizle
      document.querySelectorAll('.character-avatar').forEach(el => el.classList.remove('active'));
      
      // Tüm butonların aktiflik çizgisini kaldır
      document.querySelectorAll('.char-btn').forEach(el => el.classList.remove('active'));

      // Seçilen karakteri öne getir
      const activeData = charSettings[name];
      if(activeData) {
        document.getElementById(activeData.elementId).classList.add('active');
        
        // Tıklanan butonu sarı çerçeveli yap
        if(name === 'Şirin Baba') document.querySelector('.btn-sirin-baba').classList.add('active');
        if(name === 'Şirine') document.querySelector('.btn-sirine').classList.add('active');
        if(name === 'Gargamel ve Azman') document.querySelector('.btn-gargamel').classList.add('active');
        if(name === 'Gözlüklü Şirin') document.querySelector('.btn-gozluklu').classList.add('active');

        bubble.innerText = activeData.welcome;
        speakText(activeData.welcome);
      }
    }

    // SES TANIMA (Mikrofon Daima Açık)
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = async (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
        
        // Sesle Karakter Çağırma Kontrolü
        if (text.includes("şirin baba")) { switchCharacter("Şirin Baba"); return; }
        if (text.includes("şirine")) { switchCharacter("Şirine"); return; }
        if (text.includes("gargamel") || text.includes("azman")) { switchCharacter("Gargamel ve Azman"); return; }
        if (text.includes("gözlüklü")) { switchCharacter("Gözlüklü Şirin"); return; }

        // Normal Konuşma
        if (text.length > 1) {
          bubble.innerText = `"${text}"`;
          await processResponse(text);
        }
      };

      window.onload = () => { try { recognition.start(); } catch(e){} };
    }

    async function processResponse(userInput) {
      stopListening();
      
      let aiText = `${activeChar}: Seni duyabiliyorum küçük dostum!`;
      if(activeChar === "Gargamel ve Azman") {
        aiText = "Gargamel: Yakalayacağım seni! Azman: Miyavvv!";
      }

      bubble.innerText = aiText;
      speakText(aiText);
    }

    // KARAKTERE ÖZGÜ SES TONU İLE KONUŞMA (TTS)
    function speakText(text) {
      isSpeaking = true;
      stopListening();

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';

      const currentConfig = charSettings[activeChar];
      if (currentConfig) {
        utterance.pitch = currentConfig.pitch;
        utterance.rate = currentConfig.rate;
      }

      utterance.onend = () => {
        isSpeaking = false;
        startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopListening() { if(recognition) try{ recognition.stop(); }catch(e){} }
    function startListening() { if(recognition && !isSpeaking) try{ recognition.start(); }catch(e){} }
  </script>
</body>
</html>
