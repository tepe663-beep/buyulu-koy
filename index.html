<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şirinler Canlı Yapay Zeka Sohbeti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            width: 100%;
            height: 100%;
            background: url('image/background.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .mic-icon {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.25);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 3px solid rgba(255,255,255,0.5);
        }

        .mic-icon:hover {
            transform: translateX(-50%) scale(1.15);
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .mic-icon.listening {
            animation: pulse 1s infinite;
            background: rgba(255, 80, 80, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        .buttons-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .character-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: visible;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: transparent;
            padding: 0;
        }

        .character-btn:hover {
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-width: 6px;
        }

        .character-btn.active {
            animation: popOut 0.6s ease;
            transform: scale(1.35) translateY(-20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 100;
            border-color: #FFD700;
            border-width: 7px;
        }

        @keyframes popOut {
            0% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.5) translateY(-30px); }
            70% { transform: scale(1.25) translateY(-15px); }
            100% { transform: scale(1.35) translateY(-20px); }
        }

        .character-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .character-label {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: bold;
            font-size: 1em;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 15px;
        }

        .character-btn.active .character-label {
            bottom: -45px;
            font-size: 1.15em;
            background: rgba(255,215,0,0.3);
        }

        .status-text {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(0,0,0,0.35);
            padding: 12px 24px;
            border-radius: 25px;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .status-text.show {
            opacity: 1;
        }

        /* Mobil uyumluluk */
        @media (max-width: 650px) {
            .buttons-container {
                gap: 15px;
                bottom: 30px;
            }
            .character-btn {
                width: 90px;
                height: 90px;
            }
            .character-label {
                font-size: 0.8em;
                bottom: -30px;
                padding: 3px 8px;
            }
            .character-btn.active {
                transform: scale(1.3) translateY(-15px);
            }
            .character-btn.active .character-label {
                bottom: -38px;
                font-size: 0.95em;
            }
        }

        @media (max-width: 400px) {
            .buttons-container {
                gap: 10px;
            }
            .character-btn {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="mic-icon" id="micBtn">🎤</div>
        
        <div class="status-text" id="statusText"></div>

        <div class="buttons-container">
            <div class="character-btn" data-character="sirinbaba">
                <img src="image/sirinbababuton.png" alt="Şirin Baba">
                <div class="character-label">Şirin Baba</div>
            </div>
            
            <div class="character-btn" data-character="sirine">
                <img src="image/sirinebuton.png" alt="Şirine">
                <div class="character-label">Şirine</div>
            </div>
            
            <div class="character-btn" data-character="gozluklu">
                <img src="image/gozluklubuton.png" alt="Gözlüklü">
                <div class="character-label">Gözlüklü</div>
            </div>
            
            <div class="character-btn" data-character="gargamel">
                <img src="image/gargamelbuton.png" alt="Gargamel">
                <div class="character-label">Gargamel</div>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.character-btn');
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');

        // Buton tıklama animasyonu
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                activateCharacter(this);
            });
        });

        function activateCharacter(btn) {
            // Tüm butonlardan active sınıfını kaldır
            buttons.forEach(b => b.classList.remove('active'));
            
            // Tıklanan butona active sınıfı ekle
            btn.classList.add('active');
            
            const label = btn.querySelector('.character-label').textContent;
            showStatus(`${label} ile konuşuyorsunuz! 🎭`);
            
            // 2.5 saniye sonra active sınıfını kaldır
            setTimeout(() => {
                btn.classList.remove('active');
            }, 2500);
        }

        function showStatus(text) {
            statusText.textContent = text;
            statusText.classList.add('show');
            
            setTimeout(() => {
                statusText.classList.remove('show');
            }, 2500);
        }

        // Sesli komut sistemi
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add('listening');
                    showStatus('🎙️ Dinliyorum... Bir karakter ismi söyleyin!');
                } catch(e) {
                    console.log('Ses tanıma başlatılamadı:', e);
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                micBtn.classList.remove('listening');
                
                // Karakter isimlerini eşleştir
                const characterMap = {
                    'şirin baba': 'sirinbaba',
                    'sirin baba': 'sirinbaba',
                    'şirine': 'sirine',
                    'sirine': 'sirine',
                    'gözlüklü': 'gozluklu',
                    'gozluklu': 'gozluklu',
                    'gargamel': 'gargamel'
                };

                let found = false;
                for (let key in characterMap) {
                    if (transcript.includes(key)) {
                        const characterName = characterMap[key];
                        const btn = document.querySelector(`[data-character="${characterName}"]`);
                        if (btn) {
                            activateCharacter(btn);
                            found = true;
                            break;
                        }
                    }
                }

                if (!found) {
                    showStatus(`"${transcript}" - Karakter bulunamadı!`);
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                if (event.error !== 'no-speech') {
                    showStatus('Ses tanıma hatası: ' + event.error);
                }
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            micBtn.style.display = 'none';
            console.log('Tarayıcınız ses tanımayı desteklemiyor.');
        }
    </script>
</body>
</html>
