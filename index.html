<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şirinler Köyü Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      background: url('resim/background1.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .mic-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #00a8ff;
      border: 4px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      transition: all 0.3s;
      cursor: pointer;
    }
    .mic-indicator.listening {
      background: #44bd32;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 90%;
      max-width: 900px;
      z-index: 100;
    }

    .char-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: #ffffff;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease-in-out;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      padding: 0;
      display: block;
    }

    .char-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      pointer-events: none;
    }

    .char-btn.active {
      border-color: #fbc531;
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(251, 197, 49, 0.9);
    }
  </style>
</head>
<body>

  <div class="mic-indicator listening" id="micBtn">🎤</div>

  <!-- Audio Oynatıcı (Gizli) -->
  <audio id="audioPlayer" style="display:none;"></audio>

  <div class="bottom-bar">
    <button class="char-btn active" onclick="switchCharacter('Şirin Baba')" title="Şirin Baba">
      <img src="resim/sirinbababuton.png" alt="Şirin Baba">
    </button>
    <button class="char-btn" onclick="switchCharacter('Şirine')" title="Şirine">
      <img src="resim/sirinebuton.png" alt="Şirine">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gargamel')" title="Gargamel">
      <img src="resim/gargamelbuton.png" alt="Gargamel">
    </button>
    <button class="char-btn" onclick="switchCharacter('Gözlüklü Şirin')" title="Gözlüklü Şirin">
      <img src="resim/gozluklubuton.png" alt="Gözlüklü Şirin">
    </button>
  </div>

  <script>
    let activeChar = "Şirin Baba";
    let isSpeaking = false;

    const audioPlayer = document.getElementById('audioPlayer');

    // KARAKTER VE SES DOSYASI EŞLEŞTİRMELERİ
    const charSettings = {
      "Şirin Baba": {
        welcomeAudio: "audio/sirinbaba-karsilama.mp3",
        masalAudio: "audio/sirinbaba-masal.mp3",
        sarkiAudio: "audio/sirinbaba-sarki.mp3"
      },
      "Şirine": {
        welcomeAudio: "audio/sirine-karsilama.mp3",
        masalAudio: "audio/sirine-masal.mp3",
        sarkiAudio: "audio/sirine-sarki.mp3"
      },
      "Gargamel": {
        welcomeAudio: "audio/gargamel-karsilama.mp3",
        masalAudio: "audio/gargamel-masal.mp3",
        sarkiAudio: "audio/gargamel-sarki.mp3"
      },
      "Gözlüklü Şirin": {
        welcomeAudio: "audio/gozluklu-karsilama.mp3",
        masalAudio: "audio/gozluklu-masal.mp3",
        sarkiAudio: "audio/gozluklu-sarki.mp3"
      }
    };

    function switchCharacter(name) {
      activeChar = name;
      
      const buttons = document.querySelectorAll('.char-btn');
      buttons.forEach(el => el.classList.remove('active'));

      if(name === 'Şirin Baba') buttons[0].classList.add('active');
      if(name === 'Şirine') buttons[1].classList.add('active');
      if(name === 'Gargamel') buttons[2].classList.add('active');
      if(name === 'Gözlüklü Şirin') buttons[3].classList.add('active');

      playAudio(charSettings[name].welcomeAudio);
    }

    // SES DOSYASINI OYNATMA FONKSİYONU
    function playAudio(filePath) {
      if(!filePath) return;
      
      isSpeaking = true;
      stopListening();

      audioPlayer.src = filePath;
      audioPlayer.play().catch(err => {
        console.log("Ses oynatılamadı veya dosya bulunamadı:", err);
        isSpeaking = false;
        startListening();
      });

      audioPlayer.onended = () => {
        isSpeaking = false;
        startListening();
      };
    }

    // SES TANIMA
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = true;

      recognition.onend = () => {
        if (!isSpeaking) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
        
        // Karakter Değiştirme Komutları
        if (text.includes("şirin baba")) { switchCharacter("Şirin Baba"); return; }
        if (text.includes("şirine")) { switchCharacter("Şirine"); return; }
        if (text.includes("gargamel")) { switchCharacter("Gargamel"); return; }
        if (text.includes("gözlüklü")) { switchCharacter("Gözlüklü Şirin"); return; }

        // Masal ve Şarkı Komutları
        if (text.includes("masal") || text.includes("hikaye")) {
          playAudio(charSettings[activeChar].masalAudio);
          return;
        }
        
        if (text.includes("şarkı") || text.includes("müzik")) {
          playAudio(charSettings[activeChar].sarkiAudio);
          return;
        }
      };

      window.onload = () => { try { recognition.start(); } catch(e){} };
    }

    function stopListening() { if(recognition) try{ recognition.stop(); }catch(e){} }
    function startListening() { if(recognition && !isSpeaking) try{ recognition.start(); }catch(e){} }
  </script>
</body>
</html>
